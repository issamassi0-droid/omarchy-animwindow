# Omarchy shell surfaces. Colors derive from colors.toml; sizes and the
# typographic scale come from the keys below.

[bar]
background       = "#141210"
background-alpha = 0.98
text             = "#d1c8b0"
active           = "#c4682a"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28
icon-font        = 18

[hyprland]
active-border            = "#c4682a"
active-border-foreground = "#d1c8b0"

[controls]
normal-color        = "#c4682a"
normal-fill-alpha   = 0.04
normal-border       = "#c4682a"
normal-border-width = 1
normal-border-alpha = 0.7

hover-cursor-color        = "#d1c8b0"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#c4682a"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.7

focus-color        = "#d1c8b0"
focus-fill-alpha   = 0.08
focus-border       = "#d1c8b0"
focus-border-width = 1
focus-border-alpha = 0.25

selected-color        = "#c4682a"
selected-fill-alpha   = 0.2
selected-border       = "#c4682a"
selected-border-width = 1
selected-border-alpha = 0.7

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.10
scale-with-font = true

[font]
base-size = 12
heading = 14
icon-large = 18

[popups]
background          = "#141210"
background-alpha    = 0.98
text                = "#a09e96"
border              = "rgba(c4682aff) rgba(c4682a00) 90deg"
border-alpha        = 0.98
border-width        = 1

[tooltip]
background       = "#141210"
background-alpha = 0.95
text             = "#d1c8b0"
border           = "#c4682a"
border-alpha     = 0.95
border-width     = 1.5

[notifications]
background       = "#141210"
background-alpha = 0.95
text             = "#d1c8b0"
border           = "#c4682a"
border-alpha     = 0.95
border-width     = 1.5
countdown        = "#3a8a8a"

[launcher]
background                = "#141210"
background-alpha          = 0.95
text                      = "#d1c8b0"
border                    = "#c4682a"
border-alpha              = 0.95
scrim                     = "#141210"
scrim-alpha               = 0.5
selected-background       = "#d1c8b0"
selected-background-alpha = 0.08
selected-text             = "#c4682a"
selected-border           = "#c4682a"
selected-border-alpha     = 0.25

[menu]
border = "rgba(c4682aff) rgba(c4682a00) 90deg"
border-alpha = 0.95
border-width = 1.5
background = "#141210"
background-alpha = 0.95
selected-background = "#c4682a"
selected-background-alpha = 0.1
selected-border = "#c4682a"
selected-border-alpha = 0.3
selected-border-width = 1.5
selected-text = "#c4682a"
scrim = "#141210"
scrim-alpha = 0.0

[polkit]
background       = "#141210"
background-alpha = 0.92
text             = "#d1c8b0"
text-error       = "#c4682a"
border           = "#c4682a"
border-error     = "#c4682a"
border-alpha     = 0.95
scrim            = "#141210"
scrim-alpha      = 0.5
accent           = "#3a8a8a"

[lock]
background       = "#141210"
background-alpha = 0.95
text             = "#d1c8b0"
placeholder      = "#7a7060"
text-error       = "#c4682a"
border           = "#c4682a"
border-active    = "#c4682a"
border-error     = "#c4682a"
border-alpha     = 0.95
selection        = "#3a8a8a"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#141210"
scrim-alpha             = 0.5
text                    = "#d1c8b0"
selected-border         = "#c4682a"
selected-border-alpha   = 1.0
unselected-border       = "#d1c8b0"
unselected-border-alpha = 0.28

[workspace]
active = "#c4682a"
